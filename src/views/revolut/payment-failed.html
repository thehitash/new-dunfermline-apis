<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed - Dunfermline Taxi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-icon {
            width: 80px;
            height: 80px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            position: relative;
            animation: scaleIn 0.5s ease-out 0.2s both;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .error-icon::before,
        .error-icon::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 4px;
            background: white;
            border-radius: 2px;
        }

        .error-icon::before {
            transform: rotate(45deg);
        }

        .error-icon::after {
            transform: rotate(-45deg);
        }

        h1 {
            color: #1f2937;
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .error-details {
            background: #fef2f2;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
            border: 1px solid #fecaca;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #fecaca;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #6b7280;
            font-size: 14px;
        }

        .detail-value {
            color: #1f2937;
            font-weight: 600;
            font-size: 14px;
        }

        .error-reason {
            background: #fff1f2;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ef4444;
        }

        .error-reason p {
            color: #991b1b;
            font-size: 14px;
            margin: 0;
            text-align: left;
            font-weight: 500;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #1f2937;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
        }

        .support-link {
            color: #667eea;
            font-size: 14px;
            margin-top: 20px;
            text-decoration: none;
        }

        .support-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚕 Dunfermline Taxi</div>

        <div class="error-icon"></div>

        <h1>Payment Failed</h1>
        <p>We couldn't process your payment. Please try again or use a different payment method.</p>

        <div class="error-reason">
            <p id="errorReason">Payment was declined by your bank or payment provider.</p>
        </div>

        <div class="error-details">
            <div class="detail-row">
                <span class="detail-label">Payment ID</span>
                <span class="detail-value" id="paymentId">Loading...</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Amount</span>
                <span class="detail-value" id="amount">Loading...</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Payment Method</span>
                <span class="detail-value">Revolut</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-value" style="color: #ef4444;">Failed</span>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" onclick="retryPayment()">Try Again</button>
            <button class="btn btn-secondary" onclick="goBack()">Go Back</button>
        </div>

        <a href="mailto:support@dunfermlinetaxi.com" class="support-link">
            Need help? Contact Support
        </a>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const paymentId = urlParams.get('paymentId') || 'N/A';
        const amount = urlParams.get('amount') || 'N/A';
        const currency = urlParams.get('currency') || 'GBP';
        const errorMessage = urlParams.get('error') || 'Payment was declined by your bank or payment provider.';

        // Update page with payment details
        document.getElementById('paymentId').textContent = paymentId;
        document.getElementById('amount').textContent = `£${amount}`;
        document.getElementById('errorReason').textContent = errorMessage;

        function retryPayment() {
            // Redirect back to payment flow
            window.location.href = 'dunfermlinetaxi://payment/retry?paymentId=' + paymentId;
        }

        function goBack() {
            // Go back to ride booking
            window.location.href = 'dunfermlinetaxi://payment/cancel';
        }
    </script>
</body>
</html>
